name: deploy

# Ne part qu'après un passage réussi de `tests` sur un push dans main.
on:
  workflow_run:
    workflows: [tests]
    types: [completed]
    branches: [main]

env:
  php_version: 8.5

jobs:
  deploy:
    name: Deploy
    # `branches` filtre sur le nom de branche : sans `event == 'push'`, une PR venue
    # d'un fork depuis sa propre branche `main` déclencherait un déploiement.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      remote: ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
      # Dossier de l'app sur l'hébergement (variable du dépôt). La version PHP vient
      # de `php_version` ci-dessus, à garder alignée sur tests.yml : même version
      # pour la construction et pour `artisan` sur le serveur.
      path: ${{ vars.DEPLOY_PATH }}
    steps:
      # Le commit que `tests` a validé, pas le dernier de main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Initialize PHP ${{ env.php_version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.php_version }}
          coverage: none

      - name: Build
        run: |
          composer install --no-dev --prefer-dist --no-interaction --no-progress --optimize-autoloader
          npm ci
          npm run build

      - name: Authorize SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      # ponytail: rsync en place, pas de releases atomiques — le site est incohérent
      # pendant les quelques secondes de l'envoi. Passer à releases/ + symlink si ça gêne.
      - name: Upload
        run: |
          # Sans ce garde-fou, un `path` vide enverrait un rsync --delete à la racine du compte.
          test -n "$path" || { echo "La variable DEPLOY_PATH est vide"; exit 1; }
          rsync -rltz --no-perms --delete \
            --exclude=.env --exclude=.git --exclude=.github --exclude=.ai --exclude=.claude \
            --exclude=.junie --exclude=node_modules --exclude=nativephp --exclude=tests \
            --exclude=storage --exclude=public/storage --exclude=database/*.sqlite \
            ./ "$remote:$path/"

      # Pas de route:cache : routes/web.php contient des closures, Laravel refuse de les sérialiser.
      - name: Migrate and cache
        run: |
          php=/usr/local/php${{ env.php_version }}/bin/php
          ssh "$remote" "cd $path && $php artisan migrate --force && $php artisan config:cache && $php artisan view:cache"
